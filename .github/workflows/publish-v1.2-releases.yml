name: Publish v1.2 releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2-releases.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'LovelaceLoom/grok-plugin-cc'
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify v1.2 releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_release() {
            local tag="$1" target="$2" title="$3" resolved=""
            resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null || true)"
            if [[ -n "$resolved" && "$resolved" != "$target" ]]; then
              echo "::error::$tag resolves to $resolved; expected $target"
              exit 1
            fi

            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent >/dev/null 2>&1; then
              echo "$tag release already exists"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$tag" \
                -f target_commitish="$target" \
                -f name="$title" \
                -F draft=false \
                -F prerelease=false \
                -F generate_release_notes=true
            fi

            resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            [[ "$resolved" == "$target" ]] || { echo "::error::$tag verification failed"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '{html_url,tag_name,draft,prerelease}'
          }

          ensure_release v1.2.0 \
            6d89e5da58f36a312ddf07cd05c515ba79ec4477 \
            'v1.2.0 — Grok CLI compatibility and fan-out'
          ensure_release v1.2.1 \
            4ac3ba821d41f413d68fa35b792335fc0cc3a168 \
            'v1.2.1 — True parallel fan-out'
          ensure_release v1.2.2 \
            "$GITHUB_SHA" \
            'v1.2.2 — Repository and CI hardening'
